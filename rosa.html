<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rosa – Santa Cruz Cup</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* ══════════════════════════════════════
       HEADER ROSA
    ══════════════════════════════════════ */

    .rosa-header {
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
    }


    .rosa-team-name {

      margin: 0;

      font-family:
        'Barlow Condensed',
        sans-serif;

      font-size:
        clamp(
          2.5rem,
          6vw,
          4.8rem
        );

      font-weight: 900;

      line-height: 0.95;

      letter-spacing: 1px;

      text-transform: uppercase;

      color: #ffffff;

    }


    .rosa-girone {

      margin-top: 14px;

      font-family:
        'Barlow Condensed',
        sans-serif;

      font-size: 1rem;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;

      color:
        var(--gold, #ffb700);

    }


    /* ══════════════════════════════════════
       TASTO TORNA
    ══════════════════════════════════════ */

    .rosa-back {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      margin-top: 24px;

      padding:
        10px 18px;

      border:
        1px solid
        rgba(
          255,
          183,
          0,
          0.45
        );

      text-decoration: none;

      font-family:
        'Barlow Condensed',
        sans-serif;

      font-size: 0.8rem;

      font-weight: 700;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      color:
        var(--gold, #ffb700);

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;

    }


    .rosa-back:hover {

      background:
        var(--gold, #ffb700);

      color: #111111;

      transform:
        translateY(-2px);

    }
