<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contatti | Santa Cruz Cup</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --rosso: #e10600;
      --nero: #080808;
      --nero2: #111111;
      --bianco: #ffffff;
      --grigio: #bdbdbd;
      --bordo: rgba(255,255,255,0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(225,6,0,0.14), transparent 35%),
        var(--nero);
      color: var(--bianco);
      font-family: "Montserrat", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       NAVBAR
    ========================= */

    nav {
      width: 100%;
      background: rgba(8,8,8,0.96);
      border-bottom: 1px solid var(--bordo);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      min-height: 75px;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: "Bebas Neue", sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .logo span {
      color: var(--rosso);
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 28px;
      align-items: center;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      transition: 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--rosso);
    }

    .menu-button {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    /* =========================
       CONTENUTO
    ========================= */

    main {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 70px 20px 100px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 55px;
    }

    .page-title h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(55px, 9vw, 100px);
      line-height: 0.9;
      letter-spacing: 3px;
    }

    .page-title h1 span {
      color: var(--rosso);
    }

    .page-title p {
      margin-top: 15px;
      color: var(--grigio);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* =========================
       ICONE CONTATTI
    ========================= */

    .socials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin-bottom: 70px;
    }

    .social-link {
      width: 82px;
      height: 82px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50%;

      background: rgba(255,255,255,0.035);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .social-link:hover {
      transform: translateY(-6px);
      background: var(--rosso);
      border-color: var(--rosso);
    }

    .social-link svg {
      width: 34px;
      height: 34px;
      fill: white;
    }

    /* =========================
       FORM
    ========================= */

    .contact-box {
      max-width: 720px;
      margin: auto;

      background: var(--nero2);
      border: 1px solid var(--bordo);
      padding: 35px;
      border-radius: 12px;
    }

    .contact-box h2 {
      font-family: "Bebas Neue", sans-serif;
      font-size: 38px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .contact-box > p {
      color: var(--grigio);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      background: #080808;
      color: white;

      border-radius: 7px;
      padding: 14px;

      font-family: "Montserrat", sans-serif;
      font-size: 14px;

      outline: none;
      transition: 0.2s ease;
    }

    input:focus,
    textarea:focus {
      border-color: var(--rosso);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      border: none;
      background: var(--rosso);
      color: white;

      padding: 15px;
      border-radius: 7px;

      font-family: "Montserrat", sans-serif;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;

      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit-button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    #form-message {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      min-height: 20px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid var(--bordo);
      padding: 30px 20px;
      text-align: center;
      color: #888;
      font-size: 12px;
    }

    footer span {
      color: var(--rosso);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .nav-links {
        display: none;
        position: absolute;
        top: 75px;
        left: 0;
        width: 100%;

        background: #080808;
        border-bottom: 1px solid var(--bordo);

        flex-direction: column;
        align-items: center;

        padding: 25px;
        gap: 22px;
      }

      .nav-links.open {
        display: flex;
      }

      .menu-button {
        display: block;
      }

      .socials {
        gap: 18px;
      }

      .social-link {
        width: 70px;
        height: 70px;
      }

      .social-link svg {
        width: 29px;
        height: 29px;
      }

      .contact-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVBAR
  ========================= -->

  <nav>
    <div class="nav-container">

      <a href="index.html" class="logo">
        SANTA <span>CRUZ</span> CUP
      </a>

      <button class="menu-button" id="menuButton">
        ☰
      </button>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="squadre.html">Squadre</a></li>
        <li><a href="calendario.html">Calendario</a></li>
        <li><a href="risultati.html">Risultati</a></li>
        <li><a href="classifica.html">Classifica</a></li>
        <li><a href="marcatori.html">Marcatori</a></li>
        <li><a href="contatti.html" class="active">Contatti</a></li>
      </ul>

    </div>
  </nav>


  <!-- =========================
       CONTENUTO
  ========================= -->

  <main>

    <div class="page-title">
      <h1>CONTATTI <span>.</span></h1>
      <p>Santa Cruz Cup</p>
    </div>


    <!-- =========================
         SOLO I 3 SIMBOLI
    ========================= -->

    <div class="socials">

      <!-- INSTAGRAM -->
      <a
        class="social-link"
        href="https://www.instagram.com/_santacruzcup_/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram Santa Cruz Cup"
        title="Instagram"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2zm0 2A3.8 3.8 0 0 0 4 7.8v8.4A3.8 3.8 0 0 0 7.8 20h8.4a3.8 3.8 0 0 0 3.8-3.8V7.8A3.8 3.8 0 0 0 16.2 4H7.8zm8.65 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
        </svg>
      </a>


      <!-- DISCORD -->
      <a
        class="social-link"
        href="https://discord.gg/8YDefPdTv"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Discord Santa Cruz Cup"
        title="Discord"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.54 4.39A16.88 16.88 0 0 0 15.45 3l-.5 1.02a15.06 15.06 0 0 0-5.9 0L8.55 3a16.88 16.88 0 0 0-4.09 1.39C1.88 8.45 1.18 12.4 1.53 16.3a16.97 16.97 0 0 0 5.02 2.53l1.22-1.68c-.67-.24-1.3-.54-1.9-.9l.46-.35c3.68 1.73 7.67 1.73 11.31 0 .15.12.3.23.46.35-.6.36-1.23.66-1.9.9l1.22 1.68a16.97 16.97 0 0 0 5.02-2.53c.41-4.52-.7-8.43-2.9-11.91zM8.9 14.76c-1.08 0-1.96-1-1.96-2.23s.86-2.23 1.96-2.23 1.98 1 1.96 2.23c0 1.23-.87 2.23-1.96 2.23zm6.2 0c-1.08 0-1.96-1-1.96-2.23s.86-2.23 1.96-2.23 1.98 1 1.96 2.23c0 1.23-.87 2.23-1.96 2.23z"/>
        </svg>
      </a>


      <!-- EMAIL -->
      <a
        class="social-link"
        href="mailto:santacruzcup.info@gmail.com"
        aria-label="Email Santa Cruz Cup"
        title="Email"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </a>

    </div>


    <!-- =========================
         MODULO
    ========================= -->

    <div class="contact-box">

      <h2>SCRIVICI</h2>

      <p>
        Hai una domanda sulla Santa Cruz Cup?
        Compila il modulo e ti risponderemo.
      </p>

      <form id="contactForm">

        <div class="form-group">
          <label for="nome">Nome</label>

          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Il tuo nome"
            maxlength="80"
            required
          >
        </div>


        <div class="form-group">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="La tua email"
            maxlength="150"
            required
          >
        </div>


        <div class="form-group">
          <label for="oggetto">Oggetto</label>

          <input
            type="text"
            id="oggetto"
            name="oggetto"
            placeholder="Oggetto del messaggio"
            maxlength="120"
            required
          >
        </div>


        <div class="form-group">
          <label for="messaggio">Messaggio</label>

          <textarea
            id="messaggio"
            name="messaggio"
            placeholder="Scrivi qui il tuo messaggio..."
            maxlength="2000"
            required
          ></textarea>
        </div>


        <button
          type="submit"
          class="submit-button"
          id="submitButton"
        >
          INVIA MESSAGGIO
        </button>

        <div id="form-message"></div>

      </form>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>
    © 2026 <span>Santa Cruz Cup</span> — Tutti i diritti riservati
  </footer>


  <script>

    /* =========================
       MENU MOBILE
    ========================= */

    const menuButton = document.getElementById("menuButton");
    const navLinks = document.getElementById("navLinks");

    menuButton.addEventListener("click", () => {
      navLinks.classList.toggle("open");
    });


    /* =========================
       MODULO CONTATTI
    ========================= */

    const CONTACT_API_URL = "https://TUO-URL-PUBBLICO/api/contatti";

    const form = document.getElementById("contactForm");
    const messageBox = document.getElementById("form-message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      messageBox.textContent = "";
      submitButton.disabled = true;
      submitButton.textContent = "INVIO...";

      const dati = {
        nome: document.getElementById("nome").value.trim(),
        email: document.getElementById("email").value.trim(),
        oggetto: document.getElementById("oggetto").value.trim(),
        messaggio: document.getElementById("messaggio").value.trim()
      };

      try {

        const response = await fetch(CONTACT_API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(dati)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.error || "Errore durante l'invio.");
        }

        messageBox.textContent = "Messaggio inviato correttamente!";
        messageBox.style.color = "#4ade80";

        form.reset();

      } catch (error) {

        console.error("Errore contatti:", error);

        messageBox.textContent =
          "Non è stato possibile inviare il messaggio. Riprova più tardi.";

        messageBox.style.color = "#ff5555";

      } finally {

        submitButton.disabled = false;
        submitButton.textContent = "INVIA MESSAGGIO";

      }

    });

  </script>

</body>
</html>
